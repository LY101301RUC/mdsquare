<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: Canvas;
      --text: CanvasText;
      --muted: color-mix(in srgb, CanvasText 62%, Canvas);
      --border: color-mix(in srgb, CanvasText 18%, Canvas);
      --code: color-mix(in srgb, CanvasText 7%, Canvas);
      --accent: #0a84ff;
      --danger: #d70015;
      --image: color-mix(in srgb, #ff9f0a 18%, Canvas);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: color-mix(in srgb, var(--accent) 32%, var(--text));
      line-height: 1.22;
      margin: 1.35em 0 0.45em;
    }

    h1:first-child,
    h2:first-child,
    h3:first-child {
      margin-top: 0;
    }

    p,
    ul,
    ol,
    blockquote,
    pre,
    table {
      margin: 0.8em 0;
    }

    a {
      color: var(--accent);
    }

    a[data-blocked-link] {
      color: var(--danger);
      cursor: not-allowed;
      text-decoration: line-through;
    }

    code {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--code);
      padding: 0.12em 0.35em;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 0.92em;
    }

    pre {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--code);
      padding: 12px 14px;
    }

    pre code {
      border: 0;
      background: transparent;
      padding: 0;
    }

    blockquote {
      border-left: 3px solid var(--border);
      color: var(--muted);
      padding-left: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    th,
    td {
      border: 1px solid var(--border);
      padding: 7px 9px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--code);
      font-weight: 600;
    }

    li.task-list-item {
      list-style: none;
      margin-left: -1.4em;
    }

    li.task-list-item input[type="checkbox"] {
      margin: 0 0.45em 0 0;
      vertical-align: -0.12em;
    }

    .blocked-image {
      display: inline-block;
      border: 1px solid color-mix(in srgb, #ff9f0a 42%, var(--border));
      border-radius: 6px;
      background: var(--image);
      color: var(--muted);
      padding: 0.12em 0.45em;
      font-size: 0.92em;
    }
  </style>
</head>
<body>
  <main class="preview-content"></main>
  <script src="markdown-it.min.js"></script>
  <script src="preview-renderer.js"></script>
</body>
</html>
